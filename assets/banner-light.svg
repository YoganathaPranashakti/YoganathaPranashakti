<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Yoganatha Pranashakti - Full-Stack Web Developer and QA Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1f6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e75b6"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0e75b6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="880" height="220" fill="url(#bg)"/>
  <circle cx="770" cy="40" r="90" fill="#0e75b6" opacity="0.06" filter="url(#soft)"/>
  <circle cx="690" cy="200" r="80" fill="#7c3aed" opacity="0.07" filter="url(#soft)"/>

  <g fill="#0e75b6" opacity="0.14">
    <circle cx="742" cy="74" r="7">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="796" cy="126" r="5">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 12; 0 0" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="164" r="4">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="762" cy="118" r="48" fill="url(#card)" stroke="#0e75b6" stroke-opacity="0.25"/>
  <circle cx="762" cy="118" r="62" fill="none" stroke="#0e75b6" stroke-opacity="0.18" stroke-dasharray="4 9">
    <animateTransform attributeName="transform" type="rotate" from="0 762 118" to="360 762 118" dur="24s" repeatCount="indefinite"/>
  </circle>
  <text x="762" y="132" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="url(#accent)" text-anchor="middle">YP</text>

  <rect x="44" y="40" width="54" height="4" rx="2" fill="url(#accent)"/>
  <text x="44" y="70" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#0e75b6">FULL-STACK DEVELOPER  ·  QA ENTHUSIAST</text>
  <text x="42" y="120" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1f2328">Yoganatha Pranashakti</text>
  <text x="44" y="154" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="16" fill="#57606a">Building purposeful web experiences with PHP, Laravel &amp; JavaScript.</text>

  <text x="44" y="188" font-family="Consolas, Monaco, monospace" font-size="14" fill="url(#accent)">&gt; always learning, always shipping</text>
  <rect x="336" y="176" width="9" height="16" rx="1" fill="url(#accent)">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
